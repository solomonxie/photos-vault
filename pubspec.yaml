name: photos_vault
description: "Back up iPhone/Android photos and videos to your own S3 bucket."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  flutter_secure_storage: ^11.1.1
  aws_signature_v4: ^0.6.13
  http: ^1.6.0
  uuid: ^4.6.0
  aws_common: ^0.7.15
  sqflite: ^2.4.4
  path: ^1.9.1
  archive: ^4.2.0
  file_picker: ^12.3.0
  background_downloader: ^9.6.1
  crypto: ^3.0.7
  video_player: ^2.14.0
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  geocoding: ^4.0.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  cross_file: ^0.3.5+5
  plugin_platform_interface: ^2.1.8
  video_player_platform_interface: ^6.9.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  # Nothing is bundled. `assets/demo/` stays in the repo as test fixtures
  # and for seeding a dev build by hand; shipping it put 208 KB of someone
  # else's photos in every install. See CLAUDE.md's size budget.

dependency_overrides:
  # connectivity_plus 7.3.1 (pulled in transitively by background_downloader)
  # references an NWPath API not in the Xcode 16.4 iOS SDK yet; pin to a
  # version that builds against it.
  connectivity_plus: ^6.1.3
