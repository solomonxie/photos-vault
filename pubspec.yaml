name: back_your_own_photos
description: "Back up iPhone/Android photos and videos to your own S3 bucket."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  flutter_secure_storage: ^11.1.1
  aws_signature_v4: ^0.6.13
  http: ^1.6.0
  uuid: ^4.6.0
  aws_common: ^0.7.15
  sqflite: ^2.4.4
  path: ^1.9.1
  file_picker: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
